<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="wulin-token" content="{{ token }}"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>大侠立志传：本地存档修改器</title><link rel="stylesheet" href="/static/style.css?v=20261014-experience-books-999">
</head>
<body>
<header><div><h1>大侠立志传：本地存档修改器</h1><p>仅在本机浏览器与 <code>127.0.0.1</code> 间运行。修改先留在内存，点击各页保存才会写入。</p></div><div id="status" role="status">正在准备…</div></header>
<main>
  <section id="loadingStatus" class="panel loading-status" role="status" aria-live="polite" hidden><span id="loadingText"></span><progress id="loadingProgress" aria-label="加载进度"></progress></section>
  <section class="panel config"><h2>存档位置</h2><label class="path">游戏目录 <input id="gameRoot" placeholder="包含 Wulin.exe 的目录"></label><output id="gameRootDisplay" class="path-display"></output><label class="path">存档目录 <input id="saveRoot" placeholder="包含 Save0 的目录"></label><output id="saveRootDisplay" class="path-display"></output><div class="config-actions"><button id="configure">确认目录</button><label>存档槽 <select id="slot"></select></label><button id="load">读取存档</button></div></section>
  <nav id="tabs"><button data-tab="global" class="active">全局修改</button><button data-tab="characters">角色</button><button data-tab="affinities">情缘</button><button data-tab="books">武功秘籍</button><button data-tab="recipes">配方</button><button data-tab="consumables">消耗品</button><button data-tab="materials">材料</button><button data-tab="treasures">珍宝</button><button data-tab="items">物品</button><button data-tab="relations">NPC 关系</button><button data-tab="factions">势力关系</button></nav>
  <section id="consumables" class="tab"><div class="toolbar"><input id="consumableSearch" placeholder="按消耗品名称或 ID 搜索"><select id="consumableStatus"><option value="all">全部消耗品</option><option value="owned">已拥有</option><option value="missing">未拥有</option></select><select id="consumableRarity" aria-label="消耗品品质"><option value="all">全部品质</option><option value="3">金 · 甲级</option><option value="2">紫 · 乙级</option><option value="1">蓝 · 丙级</option><option value="0">白 · 丁级</option></select><button id="refreshConsumables">筛选</button><button id="experienceBooks999" type="button">经验书 999</button><button class="save" data-save="consumables">保存消耗品</button></div><p id="consumableSummary" class="muted"></p><div id="consumableGroups" class="book-groups"></div></section>
  <section id="treasures" class="tab"><div class="toolbar"><input id="treasureSearch" placeholder="按珍宝名称或 ID 搜索"><select id="treasureStatus"><option value="all">全部珍宝</option><option value="owned">已拥有</option><option value="missing">未拥有</option></select><select id="treasureRarity" aria-label="珍宝品质"><option value="all">全部品质</option><option value="3">金 · 甲级</option><option value="2">紫 · 乙级</option><option value="1">蓝 · 丙级</option><option value="0">白 · 丁级</option></select><button id="refreshTreasures">筛选</button><button class="save" data-save="treasures">保存珍宝</button></div><p id="treasureSummary" class="muted"></p><div id="treasureGroups" class="book-groups"></div></section>
  <section id="materials" class="tab"><div class="toolbar"><input id="materialSearch" placeholder="按材料名称或 ID 搜索"><select id="materialStatus"><option value="all">全部材料</option><option value="owned">已拥有</option><option value="missing">未拥有</option></select><select id="materialRarity" aria-label="材料品质"><option value="all">全部品质</option><option value="3">金 · 甲级</option><option value="2">紫 · 乙级</option><option value="1">蓝 · 丙级</option><option value="0">白 · 丁级</option></select><button id="refreshMaterials">筛选</button><button class="save" data-save="materials">保存材料</button></div><p id="materialSummary" class="muted"></p><div id="materialGroups" class="book-groups"></div></section>
  <section id="recipes" class="tab"><div class="toolbar"><input id="recipeSearch" placeholder="按配方名称或 ID 搜索"><select id="recipeStatus"><option value="all">全部配方</option><option value="owned">已学配方</option><option value="missing">未学配方</option></select><select id="recipeRarity" aria-label="配方品质"><option value="all">全部品质</option><option value="3">金 · 甲级</option><option value="2">紫 · 乙级</option><option value="1">蓝 · 丙级</option><option value="0">白 · 丁级</option></select><button id="refreshRecipes">筛选</button><button id="addAllRecipes">一键解锁全部未学</button><button class="save" data-save="recipes">保存配方</button></div><p id="recipeSummary" class="muted"></p><div id="recipeGroups" class="book-groups"></div></section>
  <section id="items" class="tab"><div class="toolbar"><input id="itemSearch" placeholder="按名称或 ID 搜索"><select id="itemCategory"></select><select id="itemSort"><option value="id">ID 升序</option><option value="id_desc">ID 降序</option><option value="name">名称排序</option></select><label class="check-option"><input id="showItemBooks" type="checkbox">显示武功秘籍</label><label class="check-option"><input id="showItemRecipes" type="checkbox">显示配方</label><label class="check-option"><input id="showItemConsumables" type="checkbox">显示消耗品</label><label class="check-option"><input id="showItemMaterials" type="checkbox">显示材料</label><label class="check-option"><input id="showItemTreasures" type="checkbox">显示珍宝</label><button id="refreshItems">筛选</button><button class="save" data-save="items">保存物品栏</button></div><div class="grid"><div><h2>背包</h2><table id="itemsTable"><thead><tr><th>ID</th><th>名称</th><th>分类</th><th>数量</th><th></th></tr></thead><tbody></tbody></table></div><form id="itemForm" class="card"><h2>添加 / 修改</h2><label>道具 ID<input name="id" required inputmode="numeric"></label><label>数量<input name="count" required value="1" inputmode="numeric"></label><button>添加 / 改为此数量</button><label>官方目录搜索<input id="catalogSearch" placeholder="名称或 ID"></label><div id="catalogList" class="list"></div></form></div></section>
  <section id="books" class="tab"><div class="toolbar"><input id="bookSearch" placeholder="按秘籍名称或 ID 搜索"><select id="bookStatus"><option value="all">全部秘籍</option><option value="owned">存档已有</option><option value="missing">存档未有</option></select><select id="bookRarity" aria-label="秘籍品级"><option value="all">全部品级</option><option value="3">金 · 甲级</option><option value="2">紫 · 乙级</option><option value="1">蓝 · 丙级</option><option value="0">白 · 丁级</option></select><button id="refreshBooks">筛选</button><button id="addAllBooks">一键添加全部未拥有</button><button class="save" data-save="books">保存武功秘籍</button></div><p id="bookSummary" class="muted"></p><div id="bookGroups" class="book-groups"></div></section>
  <section id="characters" class="tab"><div class="toolbar character-actions"><button class="save" data-save="characters">保存角色属性</button></div><p class="muted">离队角色位置为所读存档记录，不是游戏实时位置。</p><div class="grid chars"><aside><h2>队伍角色</h2><div id="characterList" class="list"></div></aside><div id="characterDetail" class="empty">选择一名角色。</div></div></section>
  <section id="affinities" class="tab"><div class="subtabs"><button data-affinity="Female" class="active">女性情缘</button><button data-affinity="Male">男性结义</button></div><p id="affinityHint" class="muted">读取存档后显示可结缘、结义人物的状态。</p><div class="scroll-table affinity-table"><table id="affinityTable"><thead><tr><th>角色</th><th>ID</th><th>状态</th><th>关系值</th></tr></thead><tbody></tbody></table></div></section>
  <section id="global" class="tab active"><div id="globalContent" class="cards"></div><button class="save right" data-save="global">保存全局修改</button></section>
  <section id="relations" class="tab"><div class="toolbar"><select id="npcGroup"></select><input id="relationSearch" placeholder="搜索 NPC 名称或 ID"><button id="refreshRelations">筛选</button><button class="save" data-save="relations">保存 NPC 关系</button></div><div class="scroll-table"><table id="relationsTable"><thead><tr><th>名称</th><th>ID</th><th>分类</th><th>关系</th><th></th></tr></thead><tbody></tbody></table></div></section>
  <section id="factions" class="tab"><div class="toolbar"><input id="factionSearch" placeholder="搜索势力名称或 ID"><button id="refreshFactions">筛选</button><button class="save" data-save="factions">保存势力关系</button></div><div class="scroll-table"><table id="factionsTable"><thead><tr><th>名称</th><th>ID</th><th>关系</th><th></th></tr></thead><tbody></tbody></table></div></section>
</main><dialog id="confirm"><form method="dialog"><h2 id="confirmTitle">确认</h2><p id="confirmText"></p><menu><button value="cancel">取消</button><button value="ok" class="danger">确认</button></menu></form></dialog><script src="/static/app.js?v=20261014-experience-books-999"></script>
</body></html>
