name: Windows build

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-build.txt -r requirements-test.txt
      - run: python test_public.py
      - run: python -m unittest test_editor_stats test_browser_lifecycle test_status_editor -v
      - run: node --check static/app.js
      - run: node --check static/statuses.js
      - run: python -m unittest test_ui_browser -v
      - run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WulinSHSaveEditor-windows-x64
          path: dist/WulinSHSaveEditor.exe
